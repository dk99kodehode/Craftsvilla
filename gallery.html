<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery-Craftsvilla</title>
    <link rel="stylesheet" href="gallery.css" />
        <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="javascript.js" defer></script>
  </head>

  <body>
    <header>
      <div class="logo">
        <img src="images/craftsvilla-logo.png" alt="logo" />
        <div class="logo-text">
          <h2>Craftsvilla</h2>
          <p>Workshop</p>
        </div>
      </div>

      <nav class="head-nav">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="booking.html">Booking</a>
        <a href="contact.html">Contact</a>
        <a href="index.html#about">About</a>
      </nav>

      <button class="signup"> <img class="user" src="images/user-icon.png" alt="User-icon"> <h2>Login / Signup</h2></button>
    </header>

    <main>
      <!-----------ROW 1------------>
      <section class="cards-container">
        <div class="cards-layout">
          <article class="cards article-preview">
            <img src="images/art cards/tall-building.png" alt="tall building" />
            <div class="cards-text"></div>
          </article>

          <article class="cards article-preview">
            <img src="images/art cards/drawing-lady.png" alt="drawing-lady" />
            <div class="cards-text"></div>
          </article>

          <article class="cards article-preview">
            <img src="images/art cards/lady-drawing.png" alt="lady-drawing" />
            <div class="cards-text"></div>
          </article>

          <article class="cards article-preview">
            <img src="images/art cards/flower.png" alt="flower" />
            <div class="cards-text"></div>
          </article>
        </div>
      </section>
    </main>

    <!------------FOOTER------------->
    <footer>
      <div class="socials">
        <div class="social-links">
          <img src="images/social media/x.png" alt="twitter" />
        </div>
        <div class="social-links">
          <a href="www.google.com"></a>
          <img src="images/social media/instagram.png" alt="instagram" />
        </div>
        <div class="social-links">
          <img src="images/social media/facebook.png" alt="facebook" />
        </div>
      </div>

      <nav class="nav-footer">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="booking.html">Booking</a>
        <a href="contact.html">Contact</a>
        <a href="index.html#about">About</a>
      </nav>

      <h5>©Copyrights reserved By Danny & Floppa co</h5>
    </footer>
  </body>
</html>
